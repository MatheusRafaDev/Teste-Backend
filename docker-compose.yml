version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: test_backend_db
    environment:
      POSTGRES_DB: teste_backend
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d teste_backend"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  app1:
    build: .
    container_name: test_backend_app1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/teste_backend
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  app2:
    build: .
    container_name: test_backend_app2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/teste_backend
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

networks:
  backend-net:
