spring.application.name=teste-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/teste_backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Fuso horário de negócio (para cálculo do limite diário)
app.timezone=America/Sao_Paulo

# ==============================
# CONFIGURAÇÃO DE LOGS
# ==============================

# Logs da aplicação: INFO para ver operações do negócio no terminal
logging.level.com.deltaglobal.testebackend=INFO

# SQL do Hibernate: DEBUG para ver as queries executadas (útil para inspecionar locks)
logging.level.org.hibernate.SQL=DEBUG

# Desabilita logs verbosos do framework (deixa o terminal limpo)
logging.level.org.springframework=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=WARN

# Formato de log mais legível no terminal do IntelliJ
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-40.40logger{39}){cyan} : %msg%n

# ==============================
# VIRTUAL THREADS E METRICAS
# ==============================
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus